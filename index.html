<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusFix</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>🏫 CampusFix</h1>
        <p>Report campus problems. Track solutions.</p>
    </header>

    <main>

    <section>
        <h2>📊 Campus Dashboard</h2>

        <div class="dashboard">
            <div class="stat">
                <h3 id="totalCount">0</h3>
                <p>Total Issues</p>
            </div>

            <div class="stat">
                <h3 id="reportedCount">0</h3>
                <p>Reported</p>
            </div>

            <div class="stat">
                <h3 id="progressCount">0</h3>
                <p>In Progress</p>
            </div>

            <div class="stat">
                <h3 id="fixedCount">0</h3>
                <p>Fixed</p>
            </div>
        </div>
    </section>
        <section>
    <h2>🔎 Find Issues</h2>

    <input
        type="text"
        id="searchInput"
        placeholder="Search by title, location or description..."
    >

    <select id="statusFilter">
        <option value="All">All Status</option>
        <option value="Reported">Reported</option>
        <option value="In Progress">In Progress</option>
        <option value="Fixed">Fixed</option>
    </select>

    <select id="categoryFilter">
        <option value="All">All Categories</option>
        <option value="Wi-Fi">Wi-Fi</option>
        <option value="Electricity">Electricity</option>
        <option value="Classroom">Classroom</option>
        <option value="Washroom">Washroom</option>
        <option value="Cleanliness">Cleanliness</option>
        <option value="Other">Other</option>
    </select>
</section>
        
        <section>
            <h2>Report a Problem</h2>

            <form id="issueForm">

                <label for="title">Problem Title</label><br>
                <input
                    type="text"
                    id="title"
                    placeholder="Example: Wi-Fi not working"
                    required
                >
                <br><br>
                <label for="priority">Priority</label><br>
<select id="priority" required>
    <option value="">Select priority</option>
    <option value="Low">🟢 Low</option>
    <option value="Medium">🟡 Medium</option>
    <option value="High">🔴 High</option>
</select>
<br><br>

                <label for="category">Category</label><br>
                <select id="category" required>
                    <option value="">Select category</option>
                    <option>Wi-Fi</option>
                    <option>Electricity</option>
                    <option>Classroom</option>
                    <option>Washroom</option>
                    <option>Cleanliness</option>
                    <option>Other</option>
                </select>
                <br><br>

                <label for="location">Location</label><br>
                <input
                    type="text"
                    id="location"
                    placeholder="Example: EM4 Block, Room 203"
                    required
                >
                <br><br>

                <label for="description">Description</label><br>
                <textarea
                    id="description"
                    placeholder="Describe the problem..."
                    required
                ></textarea>
                <br><br>
                <label for="image">📷 Problem Photo</label><br>

<input
    type="file"
    id="image"
    accept="image/*"
>

<br><br>

                <button type="submit">Report Problem</button>

            </form>
        </section>

        <section>
            <h2>Reported Issues</h2>
            <div id="issuesList">
                <p>No issues reported yet.</p>
            </div>
        </section>
    </main>

    <footer>
        <p>CampusFix © 2026</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
